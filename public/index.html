<div class="card"><h3>Wat is een aandeel?</h3><p>Een aandeel is een klein stukje van een bedrijf. Koop je één aandeel van Apple, dan ben je een heel klein beetje eigenaar. Gaat het goed met het bedrijf, dan wordt je aandeel vaak meer waard. Gaat het slecht, dan daalt de koers.</p></div>

<div class="card"><h3>Hoe verdien je geld?</h3><p>Door een aandeel later voor meer te verkopen dan je betaalde. Koop je voor € 100 en verkoop je voor € 120, dan is je winst € 20. Sommige bedrijven betalen ook dividend: een deel van hun winst voor de aandeelhouders.</p></div>
<div class="card"><h3>Welke risico's zijn er?</h3><p>Je kunt geld verliezen. Een koers kan snel dalen en niemand weet zeker wat er gaat gebeuren. Resultaten uit het verleden zijn geen garantie voor de toekomst. Crypto en forex schommelen vaak nog harder dan aandelen.</p></div>
